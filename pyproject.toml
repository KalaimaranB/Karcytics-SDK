[build-system]
requires = ["setuptools>=61.0.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "karcytics-sdk"
version = "2.1.2"
description = "Software Development Kit and CLI for Karcytics."
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Kalaimaran Balasothy" }
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Operating System :: OS Independent",
]
dependencies = [
    "cryptography>=41.0.0",
    "matplotlib>=3.8.0",
    "msgpack>=1.0.0",
    "numpy",
    "pandas",
    "pillow>=12.3.0",
    "PyQt6>=6.5.0",
    "requests>=2.28.0",
    "scikit-image>=0.26.0",
    "scipy",
]

[project.optional-dependencies]
docs = [
    "mkdocs-material",
    "mkdocstrings[python]",
]

[project.scripts]
karcytics-sdk = "karcytics_sdk.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
karcytics_sdk = ["py.typed", "plugin/*.qml"]

[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --tb=short --cov=src/karcytics_sdk --cov-report=term-missing --cov-report=html --cov-fail-under=20"
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [
    "ignore:.*PyQt6.*:DeprecationWarning",
]
# Safety net against a test hanging forever (e.g. a real modal Qt dialog
# that never gets closed) instead of silently stalling local/CI runs.
timeout = 60

[tool.coverage.run]
source = ["src/karcytics_sdk"]
omit = [
    "*/__init__.py",
    # Pure Qt-widget animation/rendering files — untestable headlessly.
    # Covered by visual/integration tests, not unit tests.
    "*/plugin/galactic_loader.py",
    "*/plugin/cyto_character.py",
    "*/plugin/cyto_costumes.py",
    "*/plugin/tutorial_overlay.py",
    "*/plugin/course_complete_overlay.py",
    "*/plugin/rendering/mpl_canvas.py",
    "*/plugin/menu_builder.py",
    "*/plugin/ui_preferences.py",
    "*/sdk_cli.py",
]

[tool.coverage.report]
show_missing = true
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "F", "W",  # Pyflakes & pycodestyle
    "I",            # isort (import sorting)
    "UP",           # pyupgrade
    "B",            # flake8-bugbear
    "D",            # pydocstyle
    "C90",          # mccabe complexity
    "PLR",          # pylint refactoring (complexity)
]
ignore = [
    "E501",  # Line too long (handled by formatting standards)
    "E722",  # Bare excepts (utilised in AI connection retry fallbacks)
    "D100",  # Missing docstring in public module
    "D101",  # Missing docstring in public class (redundant for UI colors/fallback classes)
    "D102",  # Missing docstring in public method (redundant for standard UI properties/callbacks)
    "D103",  # Missing docstring in public function
    "D104",  # Missing docstring in public package
    "D105",  # Missing docstring in magic method (redundant by standard definition)
    "D106",  # Missing docstring in public nested class
    "D107",  # Missing docstring in __init__ (covered by class docstring)
    "D205",  # 1 blank line between summary and description
    "B024",  # ABC with no abstract methods (perfectly valid for base data/state models)
    "B027",  # Empty hooks in ABCs without abstract decorator (standard custom override hook pattern)
]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PLR2004", "PLR0913", "PLR0915", "PLR0917"]
# Vendored, byte-for-byte ports of the Hub's own tuned animation/coaching-UI
# widgets (karcytics/ui/components/cyto_character.py etc. before this split)
# — see karcytics_sdk/plugin/tutorial_overlay.py's own docstring. Splitting
# animate()/render_step()'s branching to satisfy generic complexity
# thresholds would risk changing carefully-tuned visual behavior for no
# functional gain; the magic numbers are animation/geometry constants
# (angles, pixel offsets, probabilities), not unexplained sentinels.
"src/karcytics_sdk/plugin/cyto_character.py" = ["C901", "PLR0912", "PLR0915", "PLR2004", "PLR1714"]
"src/karcytics_sdk/plugin/cyto_costumes.py" = ["C901", "PLR0915", "PLR0911"]
"src/karcytics_sdk/plugin/tutorial_overlay.py" = ["C901", "PLR0912", "PLR0915", "PLR2004"]
"src/karcytics_sdk/plugin/course_complete_overlay.py" = ["PLR2004"]
"src/karcytics_sdk/plugin/academy_driver.py" = ["C901"]
"src/karcytics_sdk/plugin/academy_window.py" = ["PLR2004", "PLR0915"]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
check_untyped_defs = false
ignore_missing_imports = true
disable_error_code = ["assignment", "union-attr", "call-arg", "no-any-return", "method-assign", "misc", "no-redef"]
files = "src"
