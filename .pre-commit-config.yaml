# See https://pre-commit.com for more information
# See https://pre-commit.com/hooks.html for more hooks

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: check-yaml
        exclude: mkdocs.yml
      - id: end-of-file-fixer
      - id: trailing-whitespace
      - id: check-added-large-files

  - repo: local
    hooks:
      - id: ruff-lint
        name: Ruff Linter (Auto-fix)
        entry: uv run ruff check src tests --fix
        language: system
        pass_filenames: false
        types: [python]
        always_run: true

      - id: ruff-format
        name: Ruff Formatter (Auto-format)
        entry: uv run ruff format src tests
        language: system
        pass_filenames: false
        types: [python]
        always_run: true

      - id: mypy
        name: Mypy Type Checker
        entry: uv run mypy src
        language: system
        pass_filenames: false
        always_run: true

      - id: pytest
        name: Headless Unit Testing (Pytest)
        # E2E tests spin up full Qt event loops (~1s/test) and make the hook
        # appear hung on slow machines. They run in CI without this exclusion.
        entry: env QT_QPA_PLATFORM=offscreen PYTHONPATH=src uv run pytest
          --ignore=tests/unit/plugin/test_ui_daemon_runtime_e2e.py
        language: system
        pass_filenames: false
        always_run: true
