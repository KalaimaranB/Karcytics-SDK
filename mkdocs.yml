site_name: Karcytics SDK
site_description: Software Development Kit and CLI for Karcytics desktop plugins.
site_author: Kalaimaran Balasothy
site_url: https://KalaimaranB.github.io/Karcytics-SDK/

theme:
  name: material
  palette:
    # Palette toggle for light/dark mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep purple
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - search.suggest
    - search.highlight
    - content.code.copy

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            show_source: true
            show_root_heading: true

markdown_extensions:
  - admonition
  - pymdownx.highlight:
      anchor_linenums: true
      line_spans: __span
      pygments_lang_class: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format

nav:
  - Welcome: index.md
  - Getting Started: Getting_Started.md
  - Developer Guides:
      - Onboarding Guide: Developer_Onboarding.md
      - Plugin Development: Dev_Handbook.md
      - Cryptography & CI/CD: CI_CD_Guide.md
      - SDK Doctor: Doctor.md
  - API Reference:
      - Interfaces: api/interfaces.md
      - Plugin Core:
          - Base & Interfaces: api/plugin/base.md
          - Analysis Engine: api/plugin/analysis.md
          - UI Components: api/plugin/components.md
          - UI Dialogs: api/plugin/dialogs.md
          - UI Wizard: api/plugin/wizard.md
          - State & Config: api/plugin/state_and_config.md
          - Events & Logging: api/plugin/events_and_logging.md
          - Parsers (Manifest/Security): api/plugin/parsers.md
      - Host & Trust Engine:
          - Trust Manager: api/host/trust.md
          - AI Server: api/host/ai.md
      - Contrib Utilities:
          - Image Utils: api/contrib/image_utils.md
      - Testing & Contracts: api/testing.md
      - SDK CLI: api/sdk_cli.md
  - Architecture Deep-Dives: Architectural_Design.md
